<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell" aria-live="polite">
    <header class="hero">
      <p class="eyebrow">{{ app_subtitle }}</p>
      <h1>{{ app_name }}</h1>
    </header>

    <section class="gate-card" aria-label="3070Ti gate">
      <div class="card-head">
        <div>
          <p class="target-label">TARGET</p>
          <h2>3070Ti</h2>
        </div>
        <div id="statusBadge" class="status-badge offline">OFFLINE</div>
      </div>

      <div class="status-row">
        <span>状態</span>
        <strong id="statusText">OFFLINE</strong>
      </div>

      <div class="ip-row">
        <span>IP</span>
        <strong id="targetIp">{{ target_ip or '未設定' }}</strong>
      </div>

      <div id="message" class="message" role="status">
        {% if config_error %}
          {{ config_error }}
        {% elif not config_exists %}
          config.json 未設定。Wake は設定後に有効になります。
        {% elif not wake_ready %}
          target_mac 未設定。状態確認のみ実行できます。
        {% else %}
          Ready.
        {% endif %}
      </div>

      <div class="actions">
        <button id="wakeButton" class="primary" type="button">Wake</button>
        <button id="refreshButton" class="secondary" type="button">Refresh</button>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
